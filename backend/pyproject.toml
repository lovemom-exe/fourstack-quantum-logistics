[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dill==0.4.1",
    "fastapi[standard]>=0.139.0",
    "ipykernel>=7.3.0",
    "joblib==1.5.3",
    "numpy==2.5.1",
    "pandas==3.0.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "qiskit==2.5.0",
    "qiskit-machine-learning==0.9.0",
    "sqlalchemy>=2.0.51",
    "supabase>=2,<3",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
